<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mondal Brothers Chicken Delivery Service</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="header-style.css" />

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#f8b400">

    <script>
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("service-worker.js");
        }
    </script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

<span id="copyToast" class="toast">Copied!</span>

<header class="hero shiny-gold">

    <!-- Language Switcher (Top Right) -->
    <div id="langSwitcher" class="lang-pill-gold lang-top-right">
        <span class="lang-opt" onclick="switchLang('en')" data-lang="en">EN</span>
        <span class="divider">|</span>
        <span class="lang-opt" onclick="switchLang('bn')" data-lang="bn">বা</span>
    </div>

    <div class="logo-container">
        <img src="images/mb-icon.png" alt="Mondal Brothers Poultry Logo" class="logo">
    </div>

    <div class="title-row-home">
        <div class="title-stack">
            <h1 class="page-title">Mondal Brothers</h1>
            <h2 class="brand-sub">Chicken Delivery Service</h2>
        </div>
    </div>

    <p data-translate="subtitle"></p>

    <a href="tel:+919734075801" class="btn-call-rounded" data-translate="call_now"></a>

    <br/>

    <a href="https://wa.me/919734075801?text=default"
       class="btn-whatsapp"
       target="_blank"
       data-translate="signup"></a>

</header>




<main>
    <section class="accordion">

        <!-- Retail calculator -->
<!--        <a class="retail-calculator-accordion accordion-header highlight-link"-->
<!--           href="retail-calculator/retail-calculator.html"-->
<!--           data-translate="retail_calculator"></a>-->

        <a class="retail-calculator-accordion accordion-header highlight-link"
           href="retail-calculator/retail-calculator.html">

            <span data-translate="retail_calculator"></span>

            <span class="badge" data-translate="new_badge"></span>

        </a>


        <!-- PAYMENT -->
        <button class="accordion-header" data-translate="payment_opt"></button>
        <div class="accordion-content">
            <p class="title-text" data-translate="choose_payment"></p>

            <!-- UPI Payment Card -->
            <div class="card">
                <h3 class="section-title" data-translate="upi_title"></h3>

                <div class="qr-wrapper">
                    <p class="text-center bold" data-translate="scan_pay"></p>

                    <img src="images/payment-qr.jpeg" alt="Payment QR" class="qr-code" />

                    <input type="number" id="amt" class="amount-input" placeholder="" data-translate-placeholder="enter_amt" />

                    <button class="upi-pay-btn" onclick="payViaUpiSmart()" data-translate="pay_now"></button>
                </div>

                <ul class="details-list">

                    <li class="details-label" data-translate="primary_upi"></li>

                    <li class="details-row lowlight">
                        <span class="label" data-translate="name_label"></span>
                        <span class="value">Prasun Mondal</span>
                    </li>

                    <li class="details-row">
                        <span class="label" data-translate="number_label"></span>
                        <span id="upiNumber" class="value copyable">9679004046</span>
                        <i class="fa-solid fa-copy copy-icon" onclick="copyToClipboard('upiNumber')"></i>
                    </li>

                    <li class="details-row">
                        <span class="label" data-translate="upi_id_label"></span>
                        <span id="upiID" class="value copyable">prsnmondal@ybl</span>
                        <i class="fa-solid fa-copy copy-icon" onclick="copyToClipboard('upiID')"></i>
                    </li>

                    <li class="details-label" data-translate="alt_upi"></li>

                    <li class="details-row lowlight">
                        <span class="label" data-translate="name_label"></span>
                        <span class="value">Mondal Brothers</span>
                    </li>

                    <li class="details-row">
                        <span class="label" data-translate="upi_id_label"></span>
                        <span id="altUPIID" class="value copyable">mondalbrothers@upi</span>
                        <i class="fa-solid fa-copy copy-icon" onclick="copyToClipboard('altUPIID')"></i>
                    </li>

                </ul>
            </div>

            <!-- Bank transfer card -->
            <div class="card">
                <h3 class="section-title" data-translate="bank_title"></h3>

                <ul class="details-list">

                    <li class="details-row lowlight">
                        <span class="label" data-translate="bank_name"></span>
                        <span id="bankName" class="value">Canara Bank</span>
                    </li>

                    <li class="details-row lowlight">
                        <span class="label" data-translate="acc_type"></span>
                        <span class="value">Current Account</span>
                    </li>

                    <li class="details-row">
                        <span class="label" data-translate="acc_holder"></span>
                        <span id="accHolder" class="value copyable">Mondal Brothers</span>
                        <i class="fa-solid fa-copy copy-icon" onclick="copyToClipboard('accHolder')"></i>
                    </li>

                    <li class="details-row">
                        <span class="label" data-translate="acc_no"></span>
                        <span id="accNo" class="value copyable">4400201000088</span>
                        <i class="fa-solid fa-copy copy-icon" onclick="copyToClipboard('accNo')"></i>
                    </li>

                    <li class="details-row">
                        <span class="label" data-translate="ifsc"></span>
                        <span id="ifsc" class="value copyable">CNRB0000000</span>
                        <i class="fa-solid fa-copy copy-icon" onclick="copyToClipboard('ifsc')"></i>
                    </li>

                </ul>
            </div>

        </div>

        <!-- Order Tomorrow -->
        <button class="accordion-header" data-translate="order_title"></button>
        <div class="accordion-content">
            <form id="orderForm" class="form-card">

                <input type="text" id="name"
                       placeholder=""
                       data-translate-placeholder="name_ph"
                       required />

                <div class="qty-row">
                    <input type="number" id="kg" placeholder="" data-translate-placeholder="kg_ph" />
                    <span class="or-text" data-translate="or"></span>
                    <input type="number" id="pieces" placeholder="" data-translate-placeholder="pcs_ph" />
                </div>

                <button type="submit" class="primary-btn" data-translate="send_whatsapp"></button>
            </form>
        </div>

        <!-- Occasion -->
        <button class="accordion-header" data-translate="prebook_title"></button>
        <div class="accordion-content">
            <div class="card">

                <h3 class="section-title" data-translate="prebook_heading"></h3>

                <p class="small-info" data-translate="prebook_desc"></p>

                <form id="occasionForm" class="prebook-form">

                    <input type="text"
                           id="occName"
                           placeholder=""
                           data-translate-placeholder="name_ph"
                           required />

                    <input type="text"
                           id="occTitle"
                           placeholder=""
                           data-translate-placeholder="occ_ph"/>

                    <input type="date" id="occDate" required />
                    <input type="number" id="occQty" placeholder="" data-translate-placeholder="qty_ph"/>

                    <button type="button" class="primary-btn"
                            onclick="sendOccasionBooking()"
                            data-translate="submit_prebook"></button>

                </form>
            </div>
        </div>

        <!-- Contact -->
        <button class="accordion-header" data-translate="contact_title"></button>
        <div class="accordion-content">
            <p class="text-center bold">Pranab Mondal</p>
            <p class="text-center">
                <a href="tel:+919734075801" data-translate="call"></a>
            </p>
        </div>

        <!-- Share -->
        <button class="accordion-header" data-translate="share_title"></button>
        <div class="accordion-content share-grid">

            <div class="share-column">
                <button class="other-share-btn" onclick="shareViaNativeEnglish()" data-translate="share_btn"></button>

                <button class="share-btn whatsapp-share-btn"
                        onclick="shareOnWhatsAppEnglish()"
                        data-translate="share_wa"></button>
            </div>

            <div class="share-column">
                <button class="other-share-btn" onclick="shareViaNativeBengali()" data-translate="bn_share_btn"></button>

                <button class="share-btn whatsapp-share-btn"
                        onclick="shareOnWhatsAppBengali()"
                        data-translate="bn_share_wa"></button>
            </div>

        </div>

    </section>
</main>

<button id="installBtn" class="install-btn" onclick="installPwa()" style="display:none;"
        data-translate="install_btn"></button>

<div id="toast" class="toast" data-translate="toast_success"></div>

<footer data-translate="footer"></footer>

<script src="script.js"></script>
<script src="local-name-storage.js"></script>
<script src="log-worker.js"></script>
<script src="pwa-installation.js"></script>

<!-- NEW LANGUAGE SCRIPTS -->
<script src="lang.js"></script>
<script src="language.js"></script>

</body>
</html>
