<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-translate="rc_title"></title>

    <link rel="stylesheet" href="retail-calculator-script.css" />
    <link rel="stylesheet" href="retail-calculator-style.css" />
    <link rel="stylesheet" href="sales-report.css" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=settings" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back_2" />
</head>

<body>

<!-- ================= LANGUAGE SWITCH ================= -->

<span id="copyToast" class="toast" data-translate="copied"></span>


<header class="hero shiny-gold">

    <div class="title-wrapper">
        <img src="../images/mb-icon.png" alt="Mondal Brothers Poultry Logo" class="logo">

        <div class="text-block">
            <textarea id="shopName"
                      class="shop-input"
                      rows="1"
                      data-translate-placeholder="ask_shop_name"
                      oninput="autoExpand(this); saveShopName();"></textarea>

            <p class="served-text" data-translate="powered_by"></p>
        </div>

        <div class="title-row">

            <span class="material-symbols-outlined home-btn" onclick="goHome()">arrow_back_2</span>

            <h2 class="title-soft-bold" data-translate="rc_title"></h2>

            <div id="langSwitcher" class="lang-pill-gold">
                <span class="lang-opt" onclick="switchLang('en')" data-lang="en">EN</span>
                <span class="divider">|</span>
                <span class="lang-opt" onclick="switchLang('bn')" data-lang="bn">বা</span>
            </div>

            <span class="material-symbols-outlined settings-btn" onclick="openSettings()">settings</span>

        </div>
    </div>
</header>

<main>

    <div class="grid-buttons">

        <div class="choice-btn broiler_live"
             onclick="setRate('broiler_live')">
            <span class="icon">🐔</span>
            <span class="line1" data-translate="broiler"></span>
            <span class="line2" data-translate="live"></span>
        </div>

        <div class="choice-btn broiler_cut"
             onclick="setRate('broiler_cut')">
            <span class="icon">🔪</span>
            <span class="line1" data-translate="broiler"></span>
            <span class="line2" data-translate="cut"></span>
        </div>

        <div class="choice-btn culbird_live"
             onclick="setRate('culbird_live')">
            <span class="icon">🐓</span>
            <span class="line1" data-translate="culbird"></span>
            <span class="line2" data-translate="live"></span>
        </div>

        <div class="choice-btn culbird_cut"
             onclick="setRate('culbird_cut')">
            <span class="icon">🔪</span>
            <span class="line1" data-translate="culbird"></span>
            <span class="line2" data-translate="cut"></span>
        </div>

    </div>

    <p id="noRateMessage"
       style="display:none; color:#777; text-align:center; margin-top:20px; font-size:12px;"
       data-translate="set_rates_msg"></p>

    <!-- ================= CALCULATOR ================= -->
    <div class="calc-card">

        <div class="rate-display">

            <div class="left-side">
                <div class="selection-header" data-translate="selection"></div>
                <div id="selectedTypeLabel" class="selected-type" data-translate="none"></div>
            </div>

            <div class="right-side">
                <div class="rate-title" data-translate="rate"></div>
                <input id="rate"
                       class="rate-input"
                       type="number"
                       data-translate-placeholder="rate_ph"
                       oninput="autoCalc('rate')">
            </div>

        </div>

        <div class="calc-flex">
            <button class="span-btn clear-btn" onclick="clearKgAmount()">✖</button>

            <div class="left-col">

                <div class="input-wrap">
                    <input id="kg"
                           class="calc-field has-suffix"
                           type="number"
                           data-translate-placeholder="kg_ph"
                           oninput="autoCalc('kg')">
                    <span class="suffix">kg</span>
                </div>

                <div class="input-wrap">
                    <span class="prefix">₹</span>
                    <input id="amount"
                           class="calc-field has-prefix"
                           type="number"
                           data-translate-placeholder="amount_ph"
                           oninput="autoCalc('amount')">
                </div>

            </div>

            <button class="save-and-clear-btn span-btn"
                    onclick="saveAndClearKgAmount()">
                <img src="../images/right-icon.png"
                     alt="Save"
                     class="btn-icon">
            </button>

        </div>
    </div>

    <!-- ================= SALES REPORT BUTTON ================= -->
    <button id="reportToggleBtn"
            onclick="toggleReport()"
            data-translate="view_sales_report"></button>

    <div id="reportBox"></div>

    <!-- ================= DOWNLOAD ================= -->
    <div class="download-section">
        <h4 class="download-title" data-translate="download_reports"></h4>

        <div class="download-grid">

            <button class="download-btn pdf"
                    onclick="downloadPdf('full')"
                    data-translate="full_report"></button>

            <button class="download-btn pdf"
                    onclick="downloadPdf('daywise')"
                    data-translate="daily_summary"></button>

        </div>

    </div>


</main>

<footer data-translate="footer"></footer>

<script src="../local-name-storage.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="retail-calculator-script.js"></script>
<script src="../log-worker.js"></script>
<script src="/pwa-installation.js"></script>
<script src="sales-report.js"></script>

<script src="../lang.js"></script>
<script src="../language.js"></script>

</body>
</html>
